# ----------------------------------------------------------------------------
# GitHub Action workflow to
#
# - test CGE compilation and automatic tests (using various FPC versions available in Docker)
# - pack CGE into zip (using only stable FPC, since our pack_release checks it)
#
# Uses CGE Docker image https://hub.docker.com/r/kambi/castle-engine-cloud-builds-tools/
# inside GH hosted runner.
#
# See https://docs.github.com/en/actions for docs.
# ----------------------------------------------------------------------------

name: Test And Pack (Docker)

# Called by everything.yml
on: [workflow_call]
#on: [push, pull_request]

defaults:
  run:
    shell: bash

# GitHub CodeQL recommends to explicitly set permissions for GITHUB_TOKEN.
# See https://docs.github.com/en/actions/tutorials/authenticate-with-github_token .
permissions:
  contents: read

jobs:
  pack:
    name: Pack release

    # TODO: With Ubuntu 24 LTS, we hit weird "*** buffer overflow detected ***:"
    # from "zip -r castle-engine-7.0-alpha.3.snapshot-linux-x86_64.zip castle_game_engine/"
    # inside pack_release.sh .
    # Sample build: https://github.com/castle-engine/castle-engine/actions/runs/11084360353/job/30799583387
    #
    # Related somehow? https://bugzilla.redhat.com/show_bug.cgi?id=2165653
    # https://sourceforge.net/p/sevenzip/support-requests/581/
    #
    # Workaround by using Ubuntu 22 LTS for now.
    # Seehttps://github.com/actions/runner-images?tab=readme-ov-file .
    #runs-on: ubuntu-latest
    runs-on: ubuntu-22.04

    # We split pack into more>1 jobs (using matrix) to avoid running out of disk space
    # on GH hosted runners.

    container: kambi/castle-engine-cloud-builds-tools:cge-none
    strategy:
      matrix:
        pack-job-name: [
          # In the past, we made also Windows releases from Docker,
          # since we can cross-compile Windows from our Docker image (running Linux).
          # We don't do it anymore,
          # let all Windows builds be done by test-and-pack-runner-native.yml
          # and happen natively on Windows.
          #
          # This allows
          # - Packing on Windows using InnoSetup
          # - Signing on Windows using SignTool + Azure Signing DLL (although
          #   there's cross-platform jsign as alternative)
          # - Packing on Windows means we pack sources with Windows line endings
          #   (minor, since Unix line endings will also work in all compilers,
          #   but it's consistent).
          # win64-x86_64,
          # win32-i386-bundle,
          # win64-x86_64-bundle,

          # In the past, we made also non-bundled releases.
          # Dropped now: distributing them is more hassle (SF mirrors this,
          # and their space is limited) and they are not that useful.
          # linux-x86_64,

          linux-x86_64-bundle
        ]
        include:
          # - pack-job-name: win64-x86_64
          #   os: win64
          #   cpu: x86_64
          #   bundle: false
          # - pack-job-name: win32-i386-bundle
          #   os: win32
          #   cpu: i386
          #   bundle: true
          # - pack-job-name: win64-x86_64-bundle
          #   os: win64
          #   cpu: x86_64
          #   bundle: true

          # - pack-job-name: linux-x86_64
          #   os: linux
          #   cpu: x86_64
          #   bundle: false

          - pack-job-name: linux-x86_64-bundle
            os: linux
            cpu: x86_64
            bundle: true
    steps:
      - uses: actions/checkout@v7
        # Using CASTLE_PACK_GHA_DISK_SPACE_SAVE=true assumes that
        # - we have dir named exactly "castle_game_engine"
        # - parent dir of it is writeable.
        # So checkout into castle_game_engine/ subdirectory.
        with:
          path: castle_game_engine

      - name: Set environment
        run: echo "CASTLE_ENGINE_PATH=$GITHUB_WORKSPACE/castle_game_engine" >> $GITHUB_ENV

      - name: Define CGE_PACK_BUNDLE
        if: ${{ matrix.bundle }}
        run: echo "CGE_PACK_BUNDLE=yes" >> $GITHUB_ENV

      - name: Define CGE_PACK_GHA_DISK_SPACE_SAVE
        run: echo "CASTLE_PACK_GHA_DISK_SPACE_SAVE=true" >> $GITHUB_ENV

      - name: Pack
        run: |
          ./castle_game_engine/tools/internal/pack_release/pack_release.sh zip,tarxz ${{ matrix.os }} ${{ matrix.cpu }}

      - name: Archive Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-from-docker-${{ matrix.pack-job-name }}
          path: |
            castle-engine*.zip
            castle-engine*.tar.xz
          if-no-files-found: error
